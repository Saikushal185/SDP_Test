<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vertical PD Speech Workflow</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1200px;
        height: 1800px;
        background: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        color: #1f2933;
      }

      svg {
        width: 1200px;
        height: 1800px;
        display: block;
      }

      text {
        font-size: 28px;
        font-weight: 700;
        fill: #1f2933;
      }

      .small {
        font-size: 24px;
      }

      .box {
        fill: #f5fbfa;
        stroke: #087c7c;
        stroke-width: 5;
      }

      .model {
        fill: #f7f8ff;
        stroke: #4d63b6;
        stroke-width: 5;
      }

      .result {
        fill: #fffaf3;
        stroke: #b26a16;
        stroke-width: 5;
      }

      .final {
        fill: #f1fbf5;
        stroke: #2f735c;
        stroke-width: 5;
      }

      .line {
        stroke: #6d7175;
        stroke-width: 5;
        fill: none;
      }

      .arrow {
        fill: #6d7175;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1200 1800" role="img" aria-label="Vertical PD speech workflow">
      <defs>
        <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L9,4.5 L0,9 Z" class="arrow" />
        </marker>
      </defs>

      <rect class="box" x="390" y="40" width="420" height="105" rx="42" />
      <text x="600" y="84" text-anchor="middle">Start: Voice / speech</text>
      <text x="600" y="120" text-anchor="middle">sample</text>

      <line class="line" x1="600" y1="145" x2="600" y2="200" marker-end="url(#arrow)" />

      <rect class="box" x="360" y="205" width="480" height="115" rx="8" />
      <text x="600" y="252" text-anchor="middle">Extract or enter top-10</text>
      <text x="600" y="290" text-anchor="middle">speech features</text>

      <line class="line" x1="600" y1="320" x2="600" y2="375" marker-end="url(#arrow)" />

      <rect class="box" x="360" y="380" width="480" height="115" rx="8" />
      <text x="600" y="427" text-anchor="middle">Select model from</text>
      <text x="600" y="465" text-anchor="middle">website</text>

      <line class="line" x1="600" y1="495" x2="600" y2="555" marker-end="url(#arrow)" />

      <path class="model" d="M600 560 L710 670 L600 780 L490 670 Z" />
      <text x="600" y="680" text-anchor="middle">Model type</text>

      <path class="line" d="M490 670 H180 V840 H260" marker-end="url(#arrow)" />
      <path class="line" d="M600 780 V835" marker-end="url(#arrow)" />
      <path class="line" d="M710 670 H1020 V840 H940" marker-end="url(#arrow)" />

      <rect class="model" x="60" y="845" width="320" height="120" rx="8" />
      <text x="220" y="893" text-anchor="middle" class="small">Swarm AI model:</text>
      <text x="220" y="930" text-anchor="middle" class="small">PSO-SVM</text>

      <rect class="model" x="440" y="845" width="320" height="120" rx="8" />
      <text x="600" y="893" text-anchor="middle" class="small">Hybrid quantum:</text>
      <text x="600" y="930" text-anchor="middle" class="small">QSVM, VQC</text>

      <rect class="model" x="820" y="845" width="320" height="120" rx="8" />
      <text x="980" y="893" text-anchor="middle" class="small">Classical models:</text>
      <text x="980" y="930" text-anchor="middle" class="small">SVM, XGBoost</text>

      <path class="line" d="M220 965 V1045 H600 V1095" />
      <path class="line" d="M600 965 V1095" />
      <path class="line" d="M980 965 V1045 H600 V1095" marker-end="url(#arrow)" />

      <rect class="model" x="390" y="1100" width="420" height="115" rx="8" />
      <text x="600" y="1168" text-anchor="middle">Run prediction</text>

      <line class="line" x1="600" y1="1215" x2="600" y2="1275" marker-end="url(#arrow)" />

      <rect class="result" x="350" y="1280" width="500" height="125" rx="8" />
      <text x="600" y="1327" text-anchor="middle">Show PD probability,</text>
      <text x="600" y="1365" text-anchor="middle">confidence, and label</text>

      <path class="line" d="M600 1405 V1465 H310 V1515" marker-end="url(#arrow)" />
      <path class="line" d="M600 1405 V1465 H890 V1515" marker-end="url(#arrow)" />

      <rect class="result" x="90" y="1520" width="440" height="120" rx="8" />
      <text x="310" y="1567" text-anchor="middle" class="small">Model insights:</text>
      <text x="310" y="1604" text-anchor="middle" class="small">confusion matrix and metrics</text>

      <rect class="result" x="670" y="1520" width="440" height="120" rx="8" />
      <text x="890" y="1567" text-anchor="middle" class="small">Explainability:</text>
      <text x="890" y="1604" text-anchor="middle" class="small">grouped SHAP color chart</text>

      <path class="line" d="M310 1640 V1695 H600 V1715" />
      <path class="line" d="M890 1640 V1695 H600 V1715" marker-end="url(#arrow)" />

      <rect class="final" x="340" y="1720" width="520" height="70" rx="35" />
      <text x="600" y="1764" text-anchor="middle" class="small">Final result: prediction plus reasoning</text>
    </svg>
  </body>
</html>
